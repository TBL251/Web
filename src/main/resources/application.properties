spring.application.name=web
server.port=${SERVER_PORT:8080}
spring.config.import=optional:classpath:application-local.properties

# JSP View Resolver
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.mvc.static-path-pattern=/static/**

# SQL Server (tuong thich bang categories va users trong webst2)
# Co the truyen qua bien moi truong DB_URL, DB_USERNAME, DB_PASSWORD
# Hoac chay nhanh khong can SQL Server bang: --spring.profiles.active=h2
spring.datasource.url=${DB_URL:jdbc:sqlserver://127.0.0.1:1433;databaseName=webst2;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:ChangeMe123!}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
